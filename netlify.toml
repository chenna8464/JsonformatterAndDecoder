[build]
  command = "npm run build:client"
  publish = "dist/spa"

[build.environment]
  PNPM_FLAGS = "--no-frozen-lockfile"

# NOTE: there is deliberately no serverless function and no /api/* redirect.
#
# There used to be both: `/api/*` was force-redirected to a Netlify Function
# wrapping the Express app in server/. In production it returned HTTP 502 on
# every request — `Cannot find module 'express'`, because
# `external_node_modules = ["express"]` told esbuild not to bundle express while
# nothing else put it in the function's runtime — and the 502 body was a full
# Lambda stack trace exposing internal paths.
#
# Nothing called it. The client makes no fetch/XHR/sendBeacon calls at all; the
# only route was an unauthenticated /api/ping health check that the app never
# read. So the function was a broken, unused endpoint that leaked stack traces
# and pulled express's dependency surface into the deploy.
#
# Removing it is also what makes the privacy claim simple to defend: there is no
# server-side component, so there is nothing that could receive or log a user's
# JSON. server/ is kept for local development only, where vite.config.ts mounts
# it as dev middleware.

# SPA Fallback: Redirect all non-file client routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable Vite static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"

    # Content-Security-Policy.
    #
    # This app's entire job is rendering JSON that someone else may have
    # written — pasted, imported from a file, or arriving in a share link —
    # so a CSP is the highest-value control available. It was missing.
    #
    # Notes on each relaxation, so nobody widens them by accident:
    #   style-src 'unsafe-inline'  — the UI uses inline style={{…}} throughout
    #                                and global.css @imports Google Fonts.
    #   img-src data: blob:        — the graph's SVG/PNG export renders through
    #                                a canvas and hands back blob/data URLs.
    #   connect-src 'self'         — deliberately narrow: the app makes no
    #                                third-party calls, which is the privacy
    #                                claim. If this ever needs widening, the
    #                                claim needs revisiting first.
    #   object-src 'none', base-uri 'self', form-action 'self',
    #   frame-ancestors 'none'     — no plugins, no <base> hijack, no
    #                                off-site form posts, no framing.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

