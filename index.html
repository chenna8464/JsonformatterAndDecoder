      <!-- High-performance Initial CSS Preloader (Hydrated & Replaced by React) -->
      <style>
        .jsonfield-preloader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0d1117;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #ffffff;
        }
        .jsonfield-logo-glow {
          position: relative;
          width: 64px;
          height: 64px;
          background: #172033;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 0 25px rgba(45, 212, 191, 0.25);
          animation: jsonfield-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .jsonfield-loader-text {
          margin-top: 16px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.5px;
          color: #f8fafc;
        }
        .jsonfield-loader-bar {
          margin-top: 20px;
          width: 140px;
          height: 3px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }
        .jsonfield-loader-bar-fill {
          width: 40%;
          height: 100%;
          background: #2dd4bf;
          border-radius: 999px;
          position: absolute;
          animation: jsonfield-slide 1.5s ease-in-out infinite;
        }
        @keyframes jsonfield-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.85; }
        }
        @keyframes jsonfield-slide {
          0% { left: -40%; }
          100% { left: 100%; }
        }
      </style>
      <div class="jsonfield-preloader">
