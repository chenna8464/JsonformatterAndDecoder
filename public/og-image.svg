  <text x="90" y="360" font-size="66" font-weight="800" fill="#ffffff">The JSON editor</text>
  <text x="90" y="436" font-size="66" font-weight="800" fill="#ffffff">that <tspan fill="#2dd4bf">remembers.</tspan></text>

  <text x="90" y="500" font-size="27" fill="#9aa3b2">Format · Compare · Query · Convert · Graph · Annotate · Share</text>

